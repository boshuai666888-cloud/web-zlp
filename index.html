<!DOCTYPE html>
<!-- ============================================================
     个人名片 · index.html（结构层）
     说明：本文件仅负责页面「结构」，即 HTML 语义化骨架，
           所有「样式」均由 css/style.css 独立提供，
           实现结构与样式完全分离，便于后期各自维护。
     ============================================================ -->
<html lang="zh-CN">
<head>
    <!-- 声明 UTF-8 字符集，保证中文正确显示 -->
    <meta charset="UTF-8">
    <!-- 响应式视口设置：手机端也能正常缩放显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 网页标题 -->
    <title>个人名片 · 王熙博</title>
    <!-- 引入外部样式表（结构与样式分离的关键一行） -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ============================================================
         卡片主体：居中卡片式布局，含头像、姓名、职位与联系方式
         ============================================================ -->
    <main class="card">

        <!-- 圆形头像：渐变圆 + 姓名首字
             说明：不依赖外网图片，离线即可显示；
                   如需真实照片，可将 .avatar 替换为 <img> 并设置 border-radius:50% -->
        <section class="avatar-wrap" aria-label="头像">
            <img class="avatar" src="images/avatar.jpg" alt="王熙博">
        </section>

        <!-- 姓名 -->
        <h1 class="name">王熙博</h1>

        <!-- 职位 -->
        <p class="job-title">前端开发工程师</p>

        <!-- 分隔线：将个人信息与联系方式区域轻轻区分 -->
        <div class="divider"></div>

        <!-- 联系方式列表 -->
        <ul class="contact-list">

            <!-- 邮箱：点击可唤起邮件客户端 -->
            <li class="contact-item">
                <!-- 邮件图标（内联 SVG，装饰性图标，对屏幕阅读器隐藏） -->
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <a href="mailto:zhangsan@example.com">zhangsan@example.com</a>
            </li>

            <!-- 电话：点击可在手机上直接拨号 -->
            <li class="contact-item">
                <!-- 电话图标 -->
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
                <a href="tel:+8613800000000">138 0000 0000</a>
            </li>

            <!-- 微信（微信号暂无跳转，仅展示） -->
            <li class="contact-item">
                <!-- 微信图标 -->
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
                <span>微信号：zhangsan-dev</span>
            </li>

        </ul>

    </main>

</body>
</html>
